name: Weekly Challenge Generator

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Challenge Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python challenge_generator.py

      - name: Commit and push generated challenge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自動お題生成の実行とストックのリセット"
          file_pattern: "current_challenge.json weekly_stock.json"
